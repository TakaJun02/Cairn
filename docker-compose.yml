services:
  # === Vector DB ===
  chromadb:
    image: chromadb/chroma:0.6.3   # バージョンを明示推奨
    ports:
      - "8001:8000"   # ホスト8000はvLLMが使用するため8001に公開
    volumes:
      - chromadb_data:/chroma/chroma  # データ永続化フォルダ
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # === Static DB (POI / access_points) ===
  static-db:
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    ports:
      - "5432:5432"       # ローカルから接続したい場合（不要なら消してください）
    volumes:
      - pgdata_static:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U static_db -d static_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # === App DB (users / conversations) ===
  app-db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app_password}
      POSTGRES_DB: ${APP_DB_NAME:-app_db}
    ports:
      - "5433:5432" # static-dbとのポート衝突を避ける
    volumes:
      - pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-app_user} -d ${APP_DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 初期データ投入（POI / facilities / access_points）
  static-db-init:
    build:
      context: .
      dockerfile: ./backend/script/Dockerfile.init
    depends_on:
      static-db:
        condition: service_healthy
    working_dir: /app/backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend   # ← COPY せず volume で
    command: >
      bash -lc "
        set -euo pipefail;
        echo '--- Waiting for Static DB...';
        sleep 5;
        echo '--- Running Static DB init script...';
        python -B script/init_static_db.py
      "

  # App DBのテーブル作成
  app-db-init:
    build:
      context: .
      dockerfile: ./backend/script/Dockerfile.init
    depends_on:
      app-db:
        condition: service_healthy
    working_dir: /app/backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    command: >
      bash -lc "
        set -euo pipefail;
        echo '--- Waiting for App DB...';
        sleep 5;
        echo '--- Running App DB init script...';
        python -B script/init_app_db.py;
        echo '--- Ensuring spot_realtime table exists...';
        python -B script/init_spot_realtime.py
      "
  
  # === OSRM (car / foot) ===
  osrm-car:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "/data/japan-latest.osrm"]
    volumes:
      - ./backend/worker/data/map/car:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osrm-foot:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "/data/japan-latest-foot.osrm"]
    volumes:
      - ./backend/worker/data/map/foot:/data:ro
    ports:
      - "5002:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  # === API Gateway (フロント直結) ===
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      static-db:
        condition: service_healthy
      app-db:
        condition: service_healthy
      svc-nav:
        condition: service_started
      svc-agent: # AIエージェントサービスに依存
        condition: service_started
    command: bash -lc "uvicorn backend.api.main:app --host 0.0.0.0 --port 8080 --log-level debug"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # === Frontend (Vite dev server) ===
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  # === Worker側のマイクロサービス===
  svc-routing:
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.routing.main:app --host 0.0.0.0 --port 9101"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on: [osrm-car, osrm-foot, static-db]
    ports: ["9101:9101"]

  svc-alongpoi:
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.alongpoi.main:app --host 0.0.0.0 --port 9102"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on: [static-db]
    ports: ["9102:9102"]
  
  svc-llm:
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.llm.main:app --host 0.0.0.0 --port 9103"
    environment:
      KNOWLEDGE_DIR: /app/backend/worker/data/knowledge
      # コンテナ内からホストのvLLMへ (.env の 127.0.0.1 はコンテナ内では自分自身を指すため上書き)
      Inference_server: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./backend/worker/data:/app/backend/worker/data:ro
    ports: ["9103:9103"]

  svc-voice:
    build:
      context: .
      dockerfile: ./backend/worker/app/services/voice/Dockerfile
    command: |
      bash -lc "
      set -euo pipefail;
      echo '--- voice bootstrap ---';
      ffmpeg -hide_banner -version || { echo 'ERROR: ffmpeg not found in PATH'; exit 1; };
      mkdir -p /home/junta_takahashi/guidanceLLM2/packs;
      export OMP_NUM_THREADS=1;
      uvicorn backend.worker.app.services.voice.main:app --host 0.0.0.0 --port 9104
      "
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - /var/www/packs:/packs
    ports: ["9104:9104"]

  svc-nav:
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.nav.main:app --host 0.0.0.0 --port 9100"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - /var/www/packs:/packs
    depends_on: [svc-routing, svc-alongpoi, svc-llm, svc-voice]
    ports: ["9100:9100"]

  # === AI Agent Service ===
  svc-agent:
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.agent_app.api:app --host 0.0.0.0 --port 9200"
    env_file:
      - .env
    environment:
      # コンテナ内からホストのvLLMへ (.env の 127.0.0.1 はコンテナ内では自分自身を指すため上書き)
      Inference_server: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - app-db
      - chromadb
    ports: ["9200:9200"]
    restart: unless-stopped
  
volumes:
  pgdata_static:
  pgdata_app:
  chromadb_data:
  frontend_node_modules:
