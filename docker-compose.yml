services:
  # === PostgreSQL 16 + PostGIS + pgvector（新構成） ===
  db:
    image: guidance-postgres:16-3.4-pgvector
    build:
      context: ./docker/postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # === FastAPI モジュラモノリス（新構成） ===
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.app
    network_mode: host
    env_file:
      - .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      OSRM_CAR_URL: http://127.0.0.1:5001
      OSRM_FOOT_URL: http://127.0.0.1:5002
      INFERENCE_SERVER: http://127.0.0.1:8000/v1
      PACKS_ROOT: /packs
    volumes:
      - packs_data:/packs
      - ./backend/data/map/BUILD:/app/backend/data/map/BUILD:ro
    depends_on:
      db:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-foot:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --log-config
      - logging.json
      - --no-access-log
    restart: unless-stopped

  # === Vector DB ===
  chromadb:
    profiles: ["legacy"]
    image: chromadb/chroma:0.6.3   # バージョンを明示推奨
    ports:
      - "8001:8000"   # ホスト8000はvLLMが使用するため8001に公開
    volumes:
      - chromadb_data:/chroma/chroma  # データ永続化フォルダ
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # === Static DB (POI / access_points) ===
  static-db:
    profiles: ["legacy"]
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    ports:
      - "5432:5432"       # ローカルから接続したい場合（不要なら消してください）
    volumes:
      - pgdata_static:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U static_db -d static_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # === App DB (users / conversations) ===
  app-db:
    profiles: ["legacy"]
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${APP_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app_password}
      POSTGRES_DB: ${APP_DB_NAME:-app_db}
    ports:
      - "5433:5432" # static-dbとのポート衝突を避ける
    volumes:
      - pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-app_user} -d ${APP_DB_NAME:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 初期データ投入（POI / facilities / access_points）
  static-db-init:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./backend/script/Dockerfile.init
    depends_on:
      static-db:
        condition: service_healthy
    working_dir: /app/backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend   # ← COPY せず volume で
    command: >
      bash -lc "
        set -euo pipefail;
        echo '--- Waiting for Static DB...';
        sleep 5;
        echo '--- Running Static DB init script...';
        python -B script/init_static_db.py
      "

  # App DBのテーブル作成
  app-db-init:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./backend/script/Dockerfile.init
    depends_on:
      app-db:
        condition: service_healthy
    working_dir: /app/backend
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    command: >
      bash -lc "
        set -euo pipefail;
        echo '--- Waiting for App DB...';
        sleep 5;
        echo '--- Running App DB init script...';
        python -B script/init_app_db.py;
        echo '--- Ensuring spot_realtime table exists...';
        python -B script/init_spot_realtime.py
      "
  
  # === OSRM (car / foot) ===
  # データは scripts/build_osrm.sh で鳥海山エリアに切り出したもの（ADR-0014 / Docs/50_operations/osrm.md）
  osrm-car:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/chokai.osrm"]
    volumes:
      - ./backend/data/map/car:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      # 静的な ok ではなく実際のルート照会で見る（22 §6-11）。あがりこ大王 → 鳥海高原家族旅行村
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000;
          printf "GET /route/v1/car/140.0244,39.1594;140.0354,39.0342?overview=false HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "\"code\":\"Ok\"" <&3'
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osrm-foot:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/chokai.osrm"]
    volumes:
      - ./backend/data/map/foot:/data:ro
    ports:
      - "5002:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000;
          printf "GET /route/v1/foot/140.0244,39.1594;140.0354,39.0342?overview=false HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "\"code\":\"Ok\"" <&3'
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  # === API Gateway (フロント直結) ===
  api:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      static-db:
        condition: service_healthy
      app-db:
        condition: service_healthy
      svc-nav:
        condition: service_started
      svc-agent: # AIエージェントサービスに依存
        condition: service_started
    command: bash -lc "uvicorn backend.api.main:app --host 0.0.0.0 --port 8080 --log-level debug"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # === Frontend (Vite dev server) ===
  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  # === Worker側のマイクロサービス===
  svc-routing:
    profiles: ["legacy"]
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.routing.main:app --host 0.0.0.0 --port 9101"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on: [osrm-car, osrm-foot, static-db]
    ports: ["9101:9101"]

  svc-alongpoi:
    profiles: ["legacy"]
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.alongpoi.main:app --host 0.0.0.0 --port 9102"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on: [static-db]
    ports: ["9102:9102"]
  
  svc-llm:
    profiles: ["legacy"]
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.llm.main:app --host 0.0.0.0 --port 9103"
    environment:
      KNOWLEDGE_DIR: /app/backend/worker/data/knowledge
      # コンテナ内からホストのvLLMへ (.env の 127.0.0.1 はコンテナ内では自分自身を指すため上書き)
      Inference_server: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./backend/worker/data:/app/backend/worker/data:ro
    ports: ["9103:9103"]

  svc-voice:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./backend/worker/app/services/voice/Dockerfile
    command: |
      bash -lc "
      set -euo pipefail;
      echo '--- voice bootstrap ---';
      ffmpeg -hide_banner -version || { echo 'ERROR: ffmpeg not found in PATH'; exit 1; };
      export OMP_NUM_THREADS=1;
      uvicorn backend.worker.app.services.voice.main:app --host 0.0.0.0 --port 9104
      "
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - packs_data:/packs
    ports: ["9104:9104"]

  svc-nav:
    profiles: ["legacy"]
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.app.services.nav.main:app --host 0.0.0.0 --port 9100"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - packs_data:/packs
    depends_on: [svc-routing, svc-alongpoi, svc-llm, svc-voice]
    ports: ["9100:9100"]

  # === AI Agent Service ===
  svc-agent:
    profiles: ["legacy"]
    build: { context: ., dockerfile: ./backend/Dockerfile }
    command: bash -lc "uvicorn backend.worker.agent_app.api:app --host 0.0.0.0 --port 9200"
    env_file:
      - .env
    environment:
      # コンテナ内からホストのvLLMへ (.env の 127.0.0.1 はコンテナ内では自分自身を指すため上書き)
      Inference_server: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - app-db
      - chromadb
    ports: ["9200:9200"]
    restart: unless-stopped
  
volumes:
  pgdata:
  packs_data:
  pgdata_static:
  pgdata_app:
  chromadb_data:
  frontend_node_modules:
