services:
  # === PostgreSQL 16 + PostGIS + pgvector（新構成） ===
  db:
    image: guidance-postgres:16-3.4-pgvector
    build:
      context: ./docker/postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # === FastAPI モジュラモノリス（新構成） ===
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.app
    network_mode: host
    env_file:
      - .env
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      OSRM_CAR_URL: http://127.0.0.1:5001
      OSRM_FOOT_URL: http://127.0.0.1:5002
      INFERENCE_SERVER: http://127.0.0.1:8000/v1
      PACKS_ROOT: /packs
    volumes:
      - packs_data:/packs
      - ./backend/data/map/BUILD:/app/backend/data/map/BUILD:ro
    depends_on:
      db:
        condition: service_healthy
      osrm-car:
        condition: service_healthy
      osrm-foot:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --log-config
      - logging.json
      - --no-access-log
    restart: unless-stopped

  # === OSRM (car / foot) ===
  # データは scripts/build_osrm.sh で鳥海山エリアに切り出したもの（ADR-0014 / Docs/50_operations/osrm.md）
  osrm-car:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/chokai.osrm"]
    volumes:
      - ./backend/data/map/car:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      # 静的な ok ではなく実際のルート照会で見る（22 §6-11）。あがりこ大王 → 鳥海高原家族旅行村
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000;
          printf "GET /route/v1/car/140.0244,39.1594;140.0354,39.0342?overview=false HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "\"code\":\"Ok\"" <&3'
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osrm-foot:
    image: osrm/osrm-backend
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "200", "/data/chokai.osrm"]
    volumes:
      - ./backend/data/map/foot:/data:ro
    ports:
      - "5002:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000;
          printf "GET /route/v1/foot/140.0244,39.1594;140.0354,39.0342?overview=false HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "\"code\":\"Ok\"" <&3'
      interval: 30s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  # === Frontend (Vite dev server) ===
  frontend:
    image: node:20-alpine
    network_mode: host
    working_dir: /app/frontend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

volumes:
  pgdata:
  packs_data:
  frontend_node_modules:
